[package]
name = "understand-everything"
version = "0.1.0"
edition = "2021"

[dependencies]
makepad-widgets = { git = "https://github.com/makepad/makepad", branch = "dev" }
pulldown-cmark = { path = "vendor-pulldown-cmark", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
anydoc = "0.1.6"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.23.1"
hf-hub = { version = "1.0.0", features = ["blocking"] }
bincode = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
